[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-proxy-vision"
version = "0.1.0"
description = "Standalone MCP server that exposes an on-demand vision tool, querying the Claude Code Proxy's configured vision model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.23,<2",
    "fastapi[standard]>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.54.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mcp-vision = "mcp_proxy_vision.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_proxy_vision"]
